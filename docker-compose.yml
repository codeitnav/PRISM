services:
  mongo:
    image: mongo:7
    container_name: prism-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml:
    build:
      context: ./ml
    container_name: prism-ml
    restart: unless-stopped
    env_file:
      - path: ./ml/.env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017/prism
    ports:
      - "8000:8000"
    volumes:
      - ./ml:/app
      - ./data:/data
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    container_name: prism-server
    restart: unless-stopped
    env_file:
      - path: ./server/.env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017/prism
      ML_SERVICE_URL: http://ml:8000
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
    container_name: prism-client
    restart: unless-stopped
    env_file:
      - path: ./client/.env
        required: false
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  mongo_data:
